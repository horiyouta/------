<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>bg render harness</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
  #bubbleGl, #liquid {
    position: fixed; inset: 0; width: 100%; height: 100%; display:block;
  }
  #bubbleGl { z-index: 2; }
  #liquid   { z-index: 0; opacity: 1; } /* 録画用なのでフェードは無効化（常に見える） */
</style>
<script>
  /* prerender_bg.py の add_init_script がここに来る前に
     window.BG_* を仮想クロックと一緒に注入する。ここではページ単体で
     開いたときのための既定値だけ用意しておく。 */
  window.BG_FIXED_SEED     = window.BG_FIXED_SEED     ?? 20260901;
  window.BG_PREROLL_SECONDS= window.BG_PREROLL_SECONDS?? 10;
  window.BG_MANUAL_REVEAL  = false; /* 録画用: すぐに実時間で動かす（凍結しない） */
</script>
</head>
<body>
  <canvas id="bubbleGl" aria-hidden="true"></canvas>
  <canvas id="liquid" aria-hidden="true"></canvas>
  <script src="../bubble-bg.js"></script>
  <script src="../liquid-bg.js"></script>
</body>
</html>
